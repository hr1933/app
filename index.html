<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>ERROR - 链接已失效</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --muted: #888;
            --error: #ff5555;
            --border: #333;
        }
        *, *::before, *::after { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            line-height: 1.6;
            margin: 0;
            padding: clamp(10px, 3vw, 20px);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card);
            padding: clamp(20px, 5vw, 40px);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-top: 4px solid var(--error);
            display: flex;
            flex-direction: column;
            min-height: 60vh;
        }

        .terminal-header {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
        }
        .dot.red { background: var(--error); }

        h1 {
            color: var(--error);
            font-size: clamp(24px, 6vw, 32px);
            margin: 0 0 20px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        p {
            margin: 0 0 15px 0;
            font-size: clamp(14px, 4vw, 16px);
            color: var(--text);
        }

        .footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 11px;
            color: #666;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="terminal-header">
            <div class="dot red"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <span style="margin-left: auto;">/var/www/error.log</span>
        </div>

        <h1>ERROR: 链接已失效</h1>
        
        <p>该应用尚未发布，或者发布已被作者取消。</p>
        <p>请与应用的作者确认最新的访问链接。</p>

        <div class="footer">
            ©1933保留所有权利
        </div>
    </div>
</body>
</html>
